name: Merge Request Checks

on:
  workflow_call:
    inputs:
      make-commands:
        description: 'JSON array of make targets to run'
        required: false
        type: string
        default: '["lint", "unit-test", "safety"]'

jobs:
  merge_request_checks:
    runs-on: ubuntu-latest

    services:
      docker:
        image: docker:latest
        options: --privileged

    strategy:
      matrix:
        make-command: ${{ fromJson(inputs.make-commands) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install make
        run: |
          sudo apt-get update
          sudo apt-get install -y make

      - name: Running pre merge checks
        run: make ${{ matrix.make-command }}
